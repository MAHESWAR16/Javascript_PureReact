<html>

<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

       <style> 
              .abc{
                background-color: rgb(13, 164, 156);
              }

       </style>


        <body> 

             <h1 style="color: brown;" class="abc">Srikanth</h1> 

             <div id="root"> </div>

        </body>
        <script type="text/babel"> 
           var newh1 = document.createElement("h1")
           newh1.innerHTML ="mOHAN"
           newh1.classList.add("abc")
           
           document.body.appendChild(newh1) 


           

           var rh1 = React.createElement("h1",{style:{
            color:"red"
           },
           class:"abc"
        },"mahesh") 
           ReactDOM.render(rh1,document.getElementById("root"))  


          var jh1 = <h1 style={{color:"red",border:"2px solid"}} class="abc">Divya</h1>
          ReactDom.render(jh1,document.getElementById("main"))

        </script>

    </head>
